services:
  db:
    image: postgis/postgis:16-3.4
    container_name: karwan_e_khizr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-karwan_e_khizr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - karwan_e_khizr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-karwan_e_khizr}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  karwan_e_khizr_pgdata:
    driver: local